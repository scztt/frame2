[project]
name = "frame"
version = "0.1.0"
description = "Provisioning, automation, and remote management for installations and exhibitions."
authors = [
    { name = "Scott Carver", email = "scott@artificia.org" },
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.11",
    "typer>=0.15.2",
    "jinja2>=3.1.6",
    "uvicorn>=0.34.0",
    "schedule>=1.2.2",
    "python-osc>=1.9.3",
    "python-multipart>=0.0.20",
    "ansible-runner>=2.4.0",
    "pyyaml>=6.0.2",
]
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
frame = "frame.cli:app_cli"

[tool.black]
line-length = 200

[build-system]
requires = ["flit_core>=3.2,<4"]
build-backend = "flit_core.buildapi"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pytest>=8.3.5",
    "flake8>=7.1.2",
    "httpx>=0.28.1",
    "dotbot>=1.21.0",
    "pylance>=0.23.2",
    "py-spy>=0.4.0",
    "yappi>=1.6.10",
]

[tool.uvicorn]
reload = true
reload-include = ["*.py", "*.yaml"]
reload-dir = ["src/frame/examples"]
