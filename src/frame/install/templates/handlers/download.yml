---
# Handler for download type
# Downloads a file from a URL with optional checksum validation
# All tasks tagged 'artifact' for selective execution with --artifacts-only

- name: "Download: {{ step.url | basename }}"
  block:
    - name: Ensure resources directory exists
      file:
        path: "{{ config.resources_dir }}"
        state: directory
        mode: '0755'

    - name: Download file
      ansible.builtin.get_url:
        url: "{{ step.url }}"
        dest: "{{ config.resources_dir }}/{{ step.dest | default(step.url | basename) }}"
        checksum: "{{ 'sha256:' + step.sha256 if step.sha256 is defined else omit }}"
      register: download_result

    - name: Extract downloaded archive
      ansible.builtin.unarchive:
        src: "{{ config.resources_dir }}/{{ step.dest | default(step.url | basename) }}"
        dest: "{{ config.resources_dir }}"
        remote_src: yes
      when: step.unzip | default(false)

    - name: Report download
      debug:
        msg: "Downloaded {{ step.url | basename }} to {{ config.resources_dir }}"
  tags: [artifact]
