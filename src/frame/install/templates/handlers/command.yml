---
# Handler for command type
# Executes shell commands (list format preferred for paths with spaces)

- name: "Run command: {{ step.description | default(step.args if step.args is string else step.args[0]) }}"
  block:
    - name: Execute command (list format)
      command:
        argv: "{{ step.args }}"
        chdir: "{{ step.working_directory | default(omit) }}"
      environment: "{{ step.environment | default({}) }}"
      become: "{{ step.sudo | default(false) }}"
      register: command_result
      failed_when: step.ignore_errors | default(false) | ternary(false, command_result.rc != 0)
      when: step.args is sequence and step.args is not string

    - name: Execute command (string format)
      shell: "{{ step.args }}"
      args:
        chdir: "{{ step.working_directory | default(omit) }}"
      environment: "{{ step.environment | default({}) }}"
      become: "{{ step.sudo | default(false) }}"
      register: command_result
      failed_when: step.ignore_errors | default(false) | ternary(false, command_result.rc != 0)
      when: step.args is string

    - name: Report command output
      debug:
        msg: "{{ command_result.stdout if command_result.stdout is defined and command_result.stdout else 'Command completed' }}"
      when: (step.show_output | default(false)) and command_result is defined

    - name: Report completion
      debug:
        msg: "Executed: {{ step.description | default('command') }}"
