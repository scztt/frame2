---
# Canonical site.yml - loads plan.yml and executes installation steps
- name: Frame Installation
  hosts: localhost
  connection: local
  gather_facts: yes

  tasks:
    - name: Load installation plan
      include_vars:
        file: plan.yml
        name: plan
      tags: [always]

    - name: Execute installation steps
      include_tasks: step_wrapper.yml
      loop: "{{ plan.steps }}"
      loop_control:
        label: "{{ item.name | default(item.type) }}"
      vars:
        step: "{{ item }}"
        config: "{{ plan.config | default({}) }}"
      when: item.when | default(true)
      tags: [always]
