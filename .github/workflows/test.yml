name: Tests

on:
  push:
    branches: [main, refactor/*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Install Ansible
        run: |
          brew install ansible
          ansible --version

      - name: Run unit tests
        run: uv run pytest tests/ -v --ignore=tests/integration -x

      - name: Run integration tests (CI-safe subset)
        run: |
          uv run pytest tests/integration -v -x \
            -k "not (skip_if_ci or pmset or displayplacer or desktop or systemsetup or audio)" \
            --tb=short
        env:
          CI: true
          GITHUB_ACTIONS: true

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff check
        run: uv run ruff check src/ tests/
        continue-on-error: true

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/
        continue-on-error: true
