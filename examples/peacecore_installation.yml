# PeaceCore Installation State File
# Automates setup for PeaceCore art installation

config:
  peacecore_root: /Volumes/PEACECORE/Installation
  resources_dir: "{{ config.peacecore_root }}/_setup/_tools"

steps:
  # ============================================================================
  # System Configuration
  # ============================================================================

  # Enable screen sharing (via launchctl - SIP protects the plist from direct modification)
  - name: Enable screen sharing
    type: command
    args:
      [
        "launchctl",
        "load",
        "-w",
        "/System/Library/LaunchDaemons/com.apple.screensharing.plist",
      ]
    sudo: true
    ignore_errors: true # May already be loaded

  # Enable remote login (SSH)
  - name: Enable remote login (SSH)
    type: systemsetup
    items:
      remotelogin: "on"

  # ============================================================================
  # Application Installations
  # ============================================================================

  - name: Install Wall Designer
    type: install_app
    remote:
      url: https://www.datapathsoftware.com/supportdownloads/windows/driver-files/walldesigner/Wall%20Designer%203.1.0.dmg
      sha256: b1b6c08b6f67e2e25cd8da4e1be691e86b24ee806e0ad81e242e689ba0befadc

  # Install VSCode
  - name: Install VSCode
    type: install_app
    remote:
      url: https://update.code.visualstudio.com/latest/darwin-universal/stable
      dest: "{{ config.resources_dir }}/vscode.zip"

  # Install VSCode SuperCollider extension
  - name: Install vscode-supercollider extension
    type: command
    args:
      - /Applications/Visual Studio Code.app/Contents/Resources/app/bin/code
      - --install-extension
      - "{{ config.peacecore_root }}/CORE/vscode-supercollider-0.0.3.vsix"
    ignore_errors: true

  # Configure VSCode settings for SuperCollider (uses jq for jsonc compatibility)
  - name: Configure VSCode SuperCollider formatter
    type: command
    args: |
      VSCODE_SETTINGS="$HOME/Library/Application Support/Code/User/settings.json"
      mkdir -p "$(dirname "$VSCODE_SETTINGS")"
      if [ ! -f "$VSCODE_SETTINGS" ]; then echo '{}' > "$VSCODE_SETTINGS"; fi
      # Use jq to merge the setting (handles comments/trailing commas gracefully)
      jq '. + {"supercollider.sclang.formatterCmd": "/Applications/sclang-format"}' "$VSCODE_SETTINGS" > "$VSCODE_SETTINGS.tmp" && mv "$VSCODE_SETTINGS.tmp" "$VSCODE_SETTINGS"
    ignore_errors: true

  # Install sclang-format binary
  - name: Install sclang-format
    type: copy
    src: "{{ config.peacecore_root }}/_setup/_tools/sclang-format"
    dest: /Applications/sclang-format
    mode:
      user: rwx
      group: rx
      everyone: rx

  - name: Install SuperCollider
    type: install_app
    # path: "{{ config.peacecore_root }}/_setup/SuperCollider/SuperCollider.app"
    remote:
      url: https://github.com/supercollider/supercollider/releases/download/Version-3.14.1/SuperCollider-3.14.1-macOS-universal.dmg
      sha256: ed264b32752d27fc86e506dd0a7eb36de7c19ebce73c3fdf2ed5514f8c73f02e

  # Download and extract SC3 plugins to SuperCollider Extensions
  - name: Install SC3 plugins
    type: download
    url: https://github.com/supercollider/sc3-plugins/releases/download/Version-3.13.0/sc3-plugins-3.13.0-macOS.zip
    dest: "{{ config.resources_dir }}/sc3-plugins-3.13.0-macOS.zip"
    sha256: 11f88b0bd18b973a510fc2c63f1e802413c429e435935d86d2e79e13ebfe3ec7
    unarchive: true
    unarchive_dest: ~/Library/Application Support/SuperCollider/Extensions2
    remove_quarantine: true

  - name: Install TouchDesigner
    type: install_app
    remote:
      url: https://download.derivative.ca/TouchDesigner.2023.11760.arm64.dmg
      sha256: 38b925f77e3c23e15d7de25a45aa2c2a25bfd277b886de4e5a32ea3875a30f1a

  # Install BlackHole audio driver
  - name: Install BlackHole audio driver
    type: install_pkg
    remote:
      url: https://existential.audio/downloads/BlackHole2ch-0.6.1.pkg
      sha256: c829afa041a9f6e1b369c01953c8f079740dd1f02421109855829edc0d3c1988

  # Create Audio MIDI aggregate device (Scarlett + BlackHole)
  - name: Create PeaceCore aggregate audio device
    type: audio
    aggregate:
      - name: PeaceCore Aggregate
        main: Scarlett
        devices:
          - Scarlett
          - BlackHole 2ch
        multi_output: true

  - name: Install Google Chrome
    type: install_app
    remote:
      url: https://dl.google.com/chrome/mac/universal/stable/GGRO/googlechrome.dmg
      dest: "{{ config.resources_dir }}/googlechrome.dmg"

  # Frame — package as .app bundle for TCC permissions (screen recording, etc.)
  - name: Package Frame.app
    type: command
    args:
      - frame
      - package
      - --sign

  # ============================================================================
  # Manual Steps — macOS Privacy & Security Permissions
  # ============================================================================
  # These MUST be granted before daemons are started, otherwise apps will
  # silently fail (blank screenshots, no audio input, no file access).

  - name: Grant Privacy & Security permissions
    type: pause
    prompt: >
      Open System Settings > Privacy & Security and grant the following:

        FULL DISK ACCESS  (Privacy & Security > Full Disk Access)
          + Frame.app
          + SuperCollider.app
          + TouchDesigner.app

        SCREEN RECORDING  (Privacy & Security > Screen Recording)
          + Frame.app

      Tip: drag each .app from /Applications into the settings list,
      or use the "+" button to browse.

  - name: Activate TouchDesigner license
    type: pause
    prompt: >
      Launch TouchDesigner once from /Applications and activate your
      TouchDesigner Commercial license key.

      Close TouchDesigner when activation is complete.

  - name: Configure energy & login settings
    type: pause
    prompt: >
      For unattended operation, verify these system settings:

        ENERGY  (System Settings > Energy Saver / Battery)
          - Prevent automatic sleeping when the display is off: ON
          - Start up automatically after a power failure: ON

        LOCK SCREEN  (System Settings > Lock Screen)
          - Start Screen Saver when inactive: Never
          - Turn display off when inactive: Never  (or a long timeout)

        LOGIN  (System Settings > Users & Groups > Login Options)
          - Automatic login: enable for this user

      Skip any that are already configured or not applicable.

  # ============================================================================
  # PeaceCore Daemons
  # ============================================================================

  # --- User scripts (~/Library/Scripts/) ---

  - name: Copy disable_autoplay script
    type: copy
    src: "{{ config.peacecore_root }}/CORE/daemons/disable_autoplay.command"
    dest: "{{ ansible_env.HOME }}/Library/Scripts/disable_autoplay.command"
    mode: "0755"

  - name: Copy enable_autoplay script
    type: copy
    src: "{{ config.peacecore_root }}/CORE/daemons/enable_autoplay.command"
    dest: "{{ ansible_env.HOME }}/Library/Scripts/enable_autoplay.command"
    mode: "0755"

  - name: Copy on_boot script
    type: copy
    src: "{{ config.peacecore_root }}/CORE/daemons/on_boot.command"
    dest: "{{ ansible_env.HOME }}/Library/Scripts/on_boot.command"
    mode: "0755"

  - name: Copy restart_wireguard script
    type: copy
    src: "{{ config.peacecore_root }}/CORE/daemons/restart_wireguard.sh"
    dest: "{{ ansible_env.HOME }}/Library/Scripts/restart_wireguard.sh"
    mode: "0755"

  - name: Copy sclang_wrap script
    type: copy
    src: "{{ config.peacecore_root }}/CORE/daemons/sclang_wrap.sh"
    dest: "{{ ansible_env.HOME }}/Library/Scripts/sclang_wrap.sh"
    mode: "0755"

  - name: Copy validate_drive script
    type: copy
    src: "{{ config.peacecore_root }}/CORE/daemons/validate_drive.sh"
    dest: "{{ ansible_env.HOME }}/Library/Scripts/validate_drive.sh"
    mode: "0755"

  # --- System scripts (/Library/Scripts/) — requires sudo ---

  - name: Copy daily maintenance script
    type: copy
    src: "{{ config.peacecore_root }}/CORE/daemons/daily.sh"
    dest: /Library/Scripts/daily.sh
    mode: "0755"
    sudo: true

  # --- Settings ---

  - name: Copy SETTINGS_LOCAL template
    type: copy
    src: "{{ config.peacecore_root }}/CORE/SETTINGS_LOCAL_EXAMPLE.scd"
    dest: "{{ ansible_env.HOME }}/Desktop/SETTINGS_LOCAL.scd"

  # --- System daemon (LaunchDaemon, requires sudo) ---

  # Daily maintenance — runs at 4:00 AM
  - name: Daily maintenance daemon
    type: launchctl
    label: com.peacecore.daily
    system: true
    program: /bin/bash
    args:
      - /Library/Scripts/daily.sh
    start_calendar_interval:
      Hour: 4
      Minute: 0
    run_at_load: false
    keep_alive: false
    started: false

  # --- User daemons (LaunchAgents) ---

  # Enable autoplay — loaded but not auto-started, triggered manually
  - name: Autoplay start daemon
    type: launchctl
    label: com.peacecore.start
    program: /bin/bash
    args:
      - "{{ ansible_env.HOME }}/Library/Scripts/enable_autoplay.command"
    stdout_path: "{{ ansible_env.HOME }}/Desktop/com.peacecore.start.stdout"
    stderr_path: "{{ ansible_env.HOME }}/Desktop/com.peacecore.start.stderr"
    run_at_load: false
    keep_alive: false
    started: false

  # Disable autoplay — loaded but not auto-started, triggered manually
  - name: Autoplay stop daemon
    type: launchctl
    label: com.peacecore.stop
    program: /bin/bash
    args:
      - "{{ ansible_env.HOME }}/Library/Scripts/disable_autoplay.command"
    stdout_path: /tmp/com.peacecore.stop.stdout
    stderr_path: /tmp/com.peacecore.stop.stderr
    run_at_load: false
    keep_alive: false
    started: false

  # SuperCollider — headless sclang process
  - name: SuperCollider daemon
    type: launchctl
    label: com.peacecore.supercollider
    program: "{{ ansible_env.HOME }}/Library/Scripts/sclang_wrap.sh"
    args:
      - "-D"
      - "-l"
      - "./sclang_conf_headless.yaml"
      - "PLAYBACK.scd"
    working_directory: "{{ config.peacecore_root }}/CORE"
    stdout_path: "{{ ansible_env.HOME }}/Desktop/logfile.log"
    stderr_path: "{{ ansible_env.HOME }}/Desktop/error_logfile.log"
    process_type: Interactive
    run_at_load: true
    keep_alive: true

  # TouchDesigner — visual playback engine
  - name: TouchDesigner daemon
    type: launchctl
    label: com.peacecore.touchdesigner
    program: /Applications/TouchDesigner.app/Contents/MacOS/TouchDesigner
    args:
      - "{{ config.peacecore_root }}/CORE/Touchdesigner/TD_PLAYBACK_correctLayout.toe"
    stdout_path: "{{ ansible_env.HOME }}/Desktop/td_logfile.log"
    stderr_path: "{{ ansible_env.HOME }}/Desktop/td_error_logfile.log"
    process_type: Interactive
    run_at_load: true
    keep_alive: true

  # Frame — orchestration server (installs its own launchd plist)
  - name: Frame server daemon
    type: command
    args:
      - frame
      - server
      - start
      - --config
      - "{{ config.peacecore_root }}/CORE/daemons/peacecore.yaml"
      - --sudo-password
      - "{{ config.sudo_password }}"
      - --app
      - /Applications/Frame.app

  # Auto-kill monitor — restarts stuck sclang every 30 seconds
  # NOTE: Fixed label bug from original plist (was com.peacecore.supercollider)
  - name: Auto-kill sclang monitor
    type: launchctl
    label: com.peacecore.autokill
    program: "{{ config.peacecore_root }}/CORE/daemons/auto_kill.sh"
    start_interval: 30
    stdout_path: /var/log/sclang_monitor.log
    stderr_path: /var/log/sclang_monitor_error.log
    run_at_load: true
    keep_alive: false

  # ============================================================================
  # Final Steps
  # ============================================================================

  - name: Configure SETTINGS_LOCAL
    type: pause
    prompt: >
      Edit ~/Desktop/SETTINGS_LOCAL.scd:

        1. Set footagePath to the correct footage folder
        2. Set touchInChannel to the first BlackHole channel index

  - name: Open Frame web interface
    type: command
    args:
      - open
      - -a
      - Google Chrome
      - http://0.0.0.0:8000
    ignore_errors: true
